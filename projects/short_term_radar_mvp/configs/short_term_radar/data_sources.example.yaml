      material_events:
        dataset_id: 18418
        landing_url: "https://data.gov.tw/dataset/18418"
        download_url: ""
        api_url: "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap04_O"
      attention:
        dataset_id: 11395
        landing_url: "https://data.gov.tw/dataset/11395"
        download_url: ""
        api_url: null
      disposition:
        dataset_id: 11396
        landing_url: "https://data.gov.tw/dataset/11396"
        download_url: ""
        api_url: null
      corporate_actions:
        dataset_id: 11633
        landing_url: "https://data.gov.tw/dataset/11633"
        download_url: ""
        api_url: "https://www.tpex.org.tw/openapi/v1/tpex_exright_prepost"
        supplemental_api_urls:
          - "https://www.tpex.org.tw/openapi/v1/tpex_exright_daily"
      insider_holding:
        dataset_id: 22812
        landing_url: "https://data.gov.tw/dataset/22812"
        download_url: ""
        api_url: null
      valuation_daily:
        dataset_id: 11373
        landing_url: "https://data.gov.tw/dataset/11373"
        download_url: ""
        api_url: "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis"
        supplemental_api_urls:
          - "https://www.tpex.org.tw/openapi/v1/tpex_daily_market_value"
          - "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O"

  twse_eshop:
    enabled: false
    note: "Use only if official free endpoints are insufficient or a paid subscription exists. Do not hardcode credentials."
    datasets:
      surveillance:
        landing_url: "https://eshop.twse.com.tw/zh/product/detail/ac35dc52883d42c1a2eeacfa332f7e7f"
        download_url: ""
        api_url: null
      margin_short:
        landing_url: "https://eshop.twse.com.tw/zh/product/detail/388dd3a09824427d8c01a9d2b21e820b"
        download_url: ""
        api_url: null

  broker_api:
    enabled: false
    provider: "shioaji"
    readonly_only: true
    allow_order_methods: false
    datasets:
      surveillance:
        read_only_methods:
          - "api.notice()"
          - "api.punish()"
        note: "Reference only. Use a project-local read-only Shioaji client; never call order/account mutation APIs."
      margin_short:
        read_only_methods:
          - "api.credit_enquires([contract])"
          - "api.short_stock_sources([contract])"
          - "contract.margin_trading_balance"
          - "contract.short_selling_balance"
        note: "Useful for current availability checks; complete historical margin/short data should use official TWSE/TPEx daily sources."
