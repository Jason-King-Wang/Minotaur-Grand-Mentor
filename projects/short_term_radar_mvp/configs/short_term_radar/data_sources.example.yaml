data_root: ${TW_RADAR_DATA_ROOT:-data}
existing_daily_price_path: ${TW_EQUITIES_DATA_PATH:-}

fetch:
  user_agent: "short-term-radar-mvp/0.2"
  timeout_seconds: 30
  retry_count: 3
  sleep_seconds: 1.0
  respect_source_rate_limits: true

sources:
  twse:
    enabled: true
    open_data_base: "https://data.gov.tw"
    api_base: "https://openapi.twse.com.tw"
    datasets:
      prices_daily:
        dataset_id: 11549
        landing_url: "https://data.gov.tw/dataset/11549"
        download_url: ""
        api_url: null
      symbol_master:
        dataset_id: 18419
        landing_url: "https://data.gov.tw/dataset/18419"
        download_url: ""
        api_url: "https://openapi.twse.com.tw/v1/opendata/t187ap03_L"
      monthly_revenue:
        dataset_id: 18420
        landing_url: "https://data.gov.tw/dataset/18420"
        download_url: ""
        api_url: "https://openapi.twse.com.tw/v1/opendata/t187ap05_L"
      institutional_trading:
        landing_url: "https://www.twse.com.tw/zh/trading/foreign/t86.html"
        download_url: ""
        api_url: "https://www.twse.com.tw/rwd/zh/fund/T86?date={date}&selectType=ALLBUT0999&response=json"
      margin_short:
        landing_url: "https://www.twse.com.tw/zh/trading/margin/mi-margn.html"
        download_url: ""
        api_url: "https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGN"
        supplemental_api_urls:
          - "https://openapi.twse.com.tw/v1/SBL/TWT96U"
      material_events:
        dataset_id: 18415
        landing_url: "https://data.gov.tw/en/datasets/18415"
        download_url: ""
        api_url: "https://openapi.twse.com.tw/v1/opendata/t187ap04_L"
      corporate_actions:
        dataset_id: 89748
        landing_url: "https://data.gov.tw/dataset/89748"
        download_url: ""
        api_url: "https://openapi.twse.com.tw/v1/exchangeReport/TWT48U_ALL"
        supplemental_api_urls:
          - "https://openapi.twse.com.tw/v1/opendata/t187ap45_L"
      insider_holding:
        dataset_id: 22811
        landing_url: "https://data.gov.tw/dataset/22811"
        download_url: ""
        api_url: null
      trading_calendar:
        landing_url: "https://openapi.twse.com.tw/"
        download_url: ""
        api_url: "https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule"
      valuation:
        dataset_id: 11764
        landing_url: "https://data.gov.tw/dataset/11764"
        download_url: ""
        api_url: "https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_d"
        supplemental_api_urls:
          - "https://openapi.twse.com.tw/v1/opendata/t187ap03_L"

  tpex:
    enabled: true
    open_data_base: "https://data.gov.tw"
    api_base: "https://www.tpex.org.tw/openapi"
    datasets:
      prices_daily:
        dataset_id: 11371
        landing_url: "https://data.gov.tw/dataset/11371"
        download_url: ""
        api_url: null
      symbol_master:
        dataset_id: 25036
        landing_url: "https://data.gov.tw/dataset/25036"
        download_url: ""
        api_url: "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O"
      monthly_revenue:
        dataset_id: 56510
        landing_url: "https://data.gov.tw/dataset/56510"
        download_url: ""
        api_url: "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap05_O"
        supplemental_api_urls:
          - "https://www.tpex.org.tw/openapi/v1/t187ap05_R"
      institutional_trading:
        landing_url: "https://www.tpex.org.tw/web/stock/3insti/daily_trade/3itrade_hedge.php"
        download_url: ""
        api_url: "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading"
      margin_short:
        landing_url: "https://www.tpex.org.tw/web/stock/margin_trading/margin_balance/margin_bal.php"
        download_url: ""
        api_url: "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance"
        supplemental_api_urls:
